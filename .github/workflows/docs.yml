name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[docs]"
      - run: zensical build --clean
      # The registry website moved to Cloudflare Pages; keep old links working.
      - run: |
          mkdir -p site/registry
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=%s/"><link rel="canonical" href="%s/"><a href="%s/">The pack registry moved here.</a>\n' \
            https://symbola.sh https://symbola.sh https://symbola.sh > site/registry/index.html
      # Publish to the gh-pages branch, leaving PR previews in place.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false
