name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[docs]"
      - run: zensical build --clean
      # The static pack registry (docs/REGISTRY.md), served under /registry/.
      - run: symbolon site build packs --out site/registry --base-url https://kausalflow.github.io/symbolon/registry
      # Publish to the gh-pages branch, leaving PR previews in place.
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: site
          clean-exclude: pr-preview/
          force: false
