name: Docs preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        if: github.event.action != 'closed'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: "22"
      - name: Build
        if: github.event.action != 'closed'
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
        run: |
          pip install ".[docs]"
          sed -i "s|^site_url = .*|site_url = \"$PREVIEW_URL\"|" zensical.toml
          zensical build --clean
          registry-site/build.sh site/registry https://${{ github.repository_owner }}.github.io /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/registry
      # Always available, even where Pages is off: download from the run's summary page.
      - uses: actions/upload-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: docs-site-pr-${{ github.event.number }}
          path: site
          retention-days: 14
      # Publishes to gh-pages under pr-preview/pr-<n>/, comments the URL on the PR,
      # and removes the preview when the PR closes. Forks lack write access, so skip them.
      - uses: rossjrw/pr-preview-action@v1
        if: github.event.pull_request.head.repo.full_name == github.repository
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
