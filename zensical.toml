[project]
site_name = "Symbolon"
site_description = "Trustable contracts between agents: checkable specs, verifiable evidence."
site_url = "https://kausalflow.github.io/symbolon/"
repo_url = "https://github.com/kausalflow/symbolon"
repo_name = "kausalflow/symbolon"
edit_uri = "edit/main/docs/"
copyright = "Copyright &copy; 2026 kausalflow"
docs_dir = "docs"
site_dir = "site"

nav = [
  { "Home" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Concepts" = "concepts.md" },
  { "Guides" = [
    { "Writing a contract" = "guides/writing-a-contract.md" },
    { "Measuring ambiguity" = "guides/measuring-ambiguity.md" },
    { "Extracting a pack" = "guides/extracting-a-pack.md" },
    { "Replicating a pack" = "guides/replicating-a-pack.md" },
  ] },
  { "Reference" = [
    { "CLI" = "cli.md" },
    { "Contract format" = "CONTRACT_FORMAT.md" },
    { "Implementations and attestations" = "ATTESTATION.md" },
    { "Spec pack format" = "PACK_FORMAT.md" },
  ] },
  { "Examples" = [
    { "Seed contracts" = "seed-contracts.md" },
    { "Lightkone pilot" = "lightkone-pilot.md" },
  ] },
  { "Design notes (v0.3)" = "design-v0.3.md" },
]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
