[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolon"
version = "0.1.0"
description = "Trustable contracts between agents: checkable specs, verifiable evidence."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.6",
    "hypothesis>=6.100",
    "typer>=0.12",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
docs = ["zensical>=0.0.71"]

[project.scripts]
symbolon = "symbolon.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
